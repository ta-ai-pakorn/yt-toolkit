name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # update-ytdlp สั่งรันหลัง push uv.lock เข้า main

permissions:
  contents: read

jobs:
  python:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.1" # ตรึงรุ่น uv เหมือน update-ytdlp.yml
      - run: uv sync --frozen
      - run: uv run pytest -v

  web:
    timeout-minutes: 15
    runs-on: ubuntu-24.04 # ตรึงเวอร์ชัน ให้ขั้นตรวจ web/dist ไม่เปลี่ยนเองเมื่อ ubuntu-latest ขยับ
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: web/dist ต้องตรงกับ source
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"

  e2e:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.1"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: web
      - name: cache browser ของ Playwright
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install chromium # ถ้า cache ตรง จะข้ามการดาวน์โหลด
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - name: เก็บ trace ของเทสต์ที่พัง
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore
